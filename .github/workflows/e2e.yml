name: E2E Integration CI

on:
  push:
    paths:
      - "contracts/**"
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    name: e2e-integration-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "9"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install

      - name: Start Stellar Quickstart & Postgres containers
        run: |
          docker compose -f tests/e2e/docker-compose.e2e.yml up -d
          # Wait for Postgres and Quickstart RPC to be ready
          docker compose -f tests/e2e/docker-compose.e2e.yml ps

      - name: Build packages
        run: pnpm build

      - name: Run E2E Integration Suite
        run: pnpm --filter @stellar-postage/e2e test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/postage_e2e
          SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
          NETWORK_PASSPHRASE: "Standalone Network ; February 2017"

      - name: Teardown containers
        if: always()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml down -v
